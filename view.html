<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dutchman CAD image</title>
<style>
html,body{margin:0;height:100%;background:#0d1117;color:#c9d1d9;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#frame img{max-width:100vw;max-height:100vh;width:100vw;height:100vh;object-fit:contain}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;text-align:center}
#close{position:fixed;top:12px;right:16px;color:#c9d1d9;text-decoration:none;font-size:22px;opacity:.7}
#close:hover{opacity:1}
</style>
</head>
<body>
<div id="frame"><img id="img" alt=""></div>
<p id="msg">This image can't be shown here.</p>
<a id="close" href="#" aria-label="Close">&times;</a>
<script>
// Shows one image from a Dutchman CAD repository, fitted to the whole window.
// Only images hosted by the dutchman-cad organisation are shown.
(function () {
  var allowed = [
    "https://raw.githubusercontent.com/dutchman-cad/",
    "https://dutchman-cad.github.io/",
    "https://github.com/dutchman-cad/"
  ];
  var params = new URLSearchParams(location.search);
  var src = params.get("src") || "";
  var back = params.get("back") || "";
  var ok = allowed.some(function (p) { return src.indexOf(p) === 0; });
  var img = document.getElementById("img");
  var goBack = function (e) {
    if (e) e.preventDefault();
    if (back && allowed.some(function (p) { return back.indexOf(p) === 0; })) { location.href = back; }
    else if (history.length > 1) { history.back(); }
  };
  if (ok) {
    img.src = src;
    img.alt = params.get("alt") || "";
    document.title = (params.get("alt") || "Image") + " - Dutchman CAD";
  } else {
    document.getElementById("frame").style.display = "none";
    document.getElementById("msg").style.display = "flex";
  }
  document.getElementById("frame").addEventListener("click", goBack);
  document.getElementById("close").addEventListener("click", goBack);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") goBack(); });
})();
</script>
</body>
</html>
