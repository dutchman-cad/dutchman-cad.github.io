<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design viewer · Dutchman CAD</title>
<meta name="description" content="Explore a converted design in SolidCraft, with its source, credit, and conversion details.">
<meta name="theme-color" content="#1f6f5c">
<link rel="stylesheet" href="gallery.css">
</head><body><main>
<div class="brand"><a href="../">Dutchman CAD</a> · demo</div>
<a class="back" href="./">← Back to the gallery</a>
<p id="status" role="status">Loading the design…</p>
<noscript><p>Enable JavaScript to load the design viewer, or <a href="./">return to the gallery</a>.</p></noscript>
<section id="design" hidden>
<h1 id="title"></h1><span id="source" class="badge"></span>
<p id="what"></p><p id="stats" class="stats"></p><p id="credit" class="credit"></p><p id="notice" class="credit" hidden></p>
<div class="frame"><iframe id="viewer" title="Design in SolidCraft" allow="fullscreen" allowfullscreen></iframe><img id="still" alt="" width="640" height="400" hidden><div id="gate" class="gate" hidden><p id="gate-text"></p><div class="actions"><button id="gate-load" class="cta" type="button">Load it here</button></div></div></div>
<div class="actions"><a id="open" class="cta" target="_blank" rel="noopener">Open in SolidCraft</a><a id="download" class="cta alt" download>Download the design</a></div>
<p id="hint" hidden></p>
</section>
<p><small>SolidCraft's web app runs entirely in your browser; nothing is uploaded. It needs WebGPU or WebGL2. This page uses SolidCraft 0.28.0's web app.</small></p>
<script>
const get = id => document.getElementById(id);
const duration = seconds => {
  if (seconds < 90) return seconds + ' seconds';
  const halves = Math.round(seconds / 30), whole = Math.floor(halves / 2);
  return whole + (halves % 2 ? '½' : '') + ' minutes';
};
fetch('gallery.json').then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(entries => {
  const entry = entries.find(e => e.id === new URLSearchParams(location.search).get('d'));
  if (!entry) { get('status').textContent = 'We couldn’t find that design. Choose a design from the gallery using the link above.'; return; }
  document.title = entry.title + ' · Dutchman CAD';
  for (const [id, value] of Object.entries({title: entry.title, source: 'Converted from ' + entry.source_app, what: entry.what, stats: entry.stats})) get(id).textContent = value;
  const credit = document.createElement('a'); credit.textContent = entry.credit.author; credit.href = entry.credit.link;
  get('credit').append(credit, ' · ');
  if (entry.credit.licence_link) { const licence = document.createElement('a'); licence.textContent = entry.credit.licence; licence.href = entry.credit.licence_link; get('credit').append(licence); }
  else get('credit').append(entry.credit.licence);
  if (entry.notice) { get('notice').textContent = entry.notice; get('notice').hidden = false; }
  if (entry.hint) { get('hint').textContent = entry.hint; get('hint').hidden = false; }
  if (!entry.design) {
    get('viewer').remove(); get('open').remove();
    get('still').src = '../' + entry.thumb; get('still').alt = entry.title + ' in SolidCraft'; get('still').hidden = false;
    if (entry.download.url) { get('download').href = entry.download.url; get('download').textContent = 'Download the design (' + entry.download.size + ')'; }
    else { get('download').removeAttribute('download'); get('download').textContent = 'Download coming soon'; }
    get('status').hidden = true; get('design').hidden = false; return;
  }
  const designURL = new URL(entry.design, 'https://dutchman-cad.github.io/demo/').href;
  get('viewer').title = entry.title + ' in SolidCraft';
  const load = () => { get('gate').hidden = true; get('still').hidden = true; get('viewer').hidden = false; get('viewer').src = 'app/?embed&open=' + designURL; };
  if (entry.heavy) {
    get('viewer').hidden = true;
    get('still').src = '../' + entry.thumb; get('still').alt = entry.title + ' in SolidCraft'; get('still').hidden = false;
    get('gate-text').textContent = 'This design is ' + entry.heavy.size + ' with ' + entry.heavy.bodies + ' bodies. Loading it can make the page stop responding for up to about ' + duration(entry.heavy.seconds) + '.';
    get('gate-load').addEventListener('click', load);
    get('gate').hidden = false;
  } else load();
  get('open').href = 'app/?open=' + designURL;
  get('download').href = entry.design;
  get('status').hidden = true; get('design').hidden = false;
}).catch(() => { get('status').textContent = 'The design details could not load. Please refresh or return to the gallery using the link above.'; });
</script>
</main></body></html>
