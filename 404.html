<title>Dutchman Convert</title>
<script>
// Dynamic short links (GitHub Pages serves this page for any unknown path):
//   /releases/0.3.0 or /releases/v0.3.0 -> that release; /issues/N, /pull/N -> that issue or PR;
//   /github/<path> -> that path in dutchman-cad/dutchman. Anything else shows the not-found note below.
(function () {
  var R = "https://github.com/dutchman-cad/dutchman";
  var p = location.pathname.replace(/\/+$/, "");
  var m, to = null;
  if ((m = p.match(/^\/releases\/v?(\d+\.\d+\.\d+(?:-[\w.]+)?)$/))) to = R + "/releases/tag/v" + m[1];
  else if ((m = p.match(/^\/(issues|pull)\/(\d+)$/))) to = R + "/" + m[1] + "/" + m[2];
  else if ((m = p.match(/^\/github\/(.+)$/))) to = R + "/" + m[1];
  if (to) location.replace(to + location.search + location.hash);
})();
</script>
