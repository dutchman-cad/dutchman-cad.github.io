name: Update the demo's SolidCraft
on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      fake_current:
        description: 'Test run: pretend the demo is on this SolidCraft version (for example 0.45.0)'
        required: false
        default: ''
      live:
        description: 'Only check the live site: open every demo design through https://dutchmancad.xyz (its Worker and .wasm), change nothing'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency: solidcraft-demo
jobs:
  bump:
    if: github.event.schedule != '43 3 * * *' && !inputs.live
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FAKE_CURRENT: ${{ inputs.fake_current }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Bump the web app to the current release
        id: bump
        run: |
          v=$(scripts/bump_solidcraft_web.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install a browser
        if: steps.bump.outputs.version != ''
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      # The pull request below is made with GITHUB_TOKEN, which does not start other workflows, so
      # the checks run here, before it exists. A failure opens a draft and never merges.
      # RailCore (about 12 minutes) is opened by the nightly job instead.
      - name: Check every demo design opens
        id: load
        if: steps.bump.outputs.version != ''
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check_demo_load.mjs --no-heavy --out "$RUNNER_TEMP/shots" 2>&1 | tee "$RUNNER_TEMP/load.log"
      - name: Check the gallery
        id: gallery
        if: steps.bump.outputs.version != ''
        continue-on-error: true
        run: python3 scripts/check_gallery.py
      - name: Upload the web app's .wasm as a release asset
        if: steps.bump.outputs.version != '' && steps.load.outcome == 'success' && steps.gallery.outcome == 'success'
        run: scripts/upload_wasm_asset.sh
      - name: Open the pull request
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          LOAD: ${{ steps.load.outcome }}
          GALLERY: ${{ steps.gallery.outcome }}
        run: |
          branch="demo-solidcraft-$VERSION-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add demo
          git commit --allow-empty -m "Demo: SolidCraft $VERSION web app"
          git push origin "$branch"
          if [ "$LOAD" = success ] && [ "$GALLERY" = success ]; then
            printf 'Replaces demo/app with solidcraft-web-%s.zip; its .wasm is the release asset web-%s (demo/app/wasm-asset.json). All embedded designs except the heavy ones opened in it (scripts/check_demo_load.mjs); gallery check passed.\n' "$VERSION" "$VERSION" > "$RUNNER_TEMP/body.md"
            url=$(gh pr create --base main --head "$branch" --title "Demo: SolidCraft $VERSION web app" --body-file "$RUNNER_TEMP/body.md")
            # The live site serves the .wasm through the Cloudflare Worker; merge only once it is deployed with that route.
            if curl -fsSI https://dutchmancad.xyz/demo/ | grep -qi '^x-site-worker: 2'; then
              gh pr merge "$url" --squash --delete-branch
            else
              echo "::warning::the dutchmancad.xyz Worker does not serve the web app's .wasm yet (see .worker/README.md); left $url open"
            fi
          else
            { printf 'The SolidCraft %s web app did not pass its checks, so this is a draft and is not merged.\n\n```\n' "$VERSION"; grep -E '^(FAIL|[0-9]+ design)' "$RUNNER_TEMP/load.log" || true; printf 'gallery check: %s\n```\n' "$GALLERY"; } > "$RUNNER_TEMP/body.md"
            gh pr create --draft --base main --head "$branch" --title "Demo: SolidCraft $VERSION web app (checks failed)" --body-file "$RUNNER_TEMP/body.md"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.bump.outputs.version != ''
        with:
          name: demo-load-shots
          path: ${{ runner.temp }}/shots
  nightly:
    # The heavy designs (RailCore, about 12 minutes in software rendering) open once a night on the demo as merged.
    if: github.event.schedule == '43 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Install a browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      - name: Open the heavy designs
        run: |
          set -o pipefail
          node scripts/check_demo_load.mjs --heavy-only --out "$RUNNER_TEMP/shots" 2>&1 | tee "$RUNNER_TEMP/heavy.log"
          { echo '### Heavy designs'; echo '```'; cat "$RUNNER_TEMP/heavy.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-heavy-shots
          path: ${{ runner.temp }}/shots
  live:
    # On request: the same load check against the deployed site, through its Worker, instead of this checkout.
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Install a browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      - name: Open the demo designs on the live site
        run: |
          set -o pipefail
          node scripts/check_demo_load.mjs --base https://dutchmancad.xyz --no-heavy --out "$RUNNER_TEMP/shots" 2>&1 | tee "$RUNNER_TEMP/live.log"
          { echo '### Live site'; echo '```'; cat "$RUNNER_TEMP/live.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-live-shots
          path: ${{ runner.temp }}/shots
