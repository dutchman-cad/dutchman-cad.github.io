name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - run: python3 scripts/check_gallery.py
      - run: python3 -m unittest test_solidcraft_current
        working-directory: scripts
      - run: cd .worker && npm test
